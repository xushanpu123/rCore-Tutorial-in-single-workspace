﻿name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build syscall
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --package syscall

      - name: Check format
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --check
   

      - name: usertests
        run: |
         rustup component add llvm-tools-preview
         export PATH="$HOME/.rustup/toolchains/$(rustup show active-toolchain)/bin:$PATH"
         pip install toml
         pip install python-liquid
         pip install termcolor
         ./run.py --ch 8 --arch riscv64 --release  qemu
         ./run.py --ch 8 --arch aarch64 --release  qemu
         ./run.py --ch 8 --arch x86_64 --release  qemu
         ./run.py --ch 8 --arch loongarch64 --release  qemu   

      
