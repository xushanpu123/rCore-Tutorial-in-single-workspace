name: CI

on:
  push:
    branches: [ "v3" ]
  pull_request:
    branches: [ "v3" ]

env:
  CARGO_TERM_COLOR: always
  rust_toolchain: nightly-2023-12-01

jobs:
  setup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libslirp-dev libglib2.0-dev \
          qemu-system-misc qemu-system-arm qemu-system-x86 python3-pip
          rustup component add llvm-tools-preview
          cargo install cargo-binutils --version 0.3.0
          pip install toml python-liquid termcolor

      - name: Cache QEMU
        id: cache-qemu
        uses: actions/cache/restore@v4
        with:
          path: qemu_build
          key: qemu-9.0.0-slirp-1

      - name: Download and build QEMU
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        env:
          QEMU_PATH: qemu-9.0.0
          PREFIX: ${{ github.workspace }}/qemu_build
        shell: bash
        run: |
          wget https://download.qemu.org/$QEMU_PATH.tar.xz && tar -xJf $QEMU_PATH.tar.xz
          cd $QEMU_PATH \
            && ./configure --prefix=$PREFIX --target-list=loongarch64-softmmu \
            && make -j > build.log 2>&1 || (cat build.log && exit 1) \
            && make install
      - uses: actions/cache/save@v4
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        with:
          path: qemu_build
          key: qemu-9.0.0-slirp-1

      - name: Add QEMU to PATH
        shell: bash
        run: |
          echo "$PWD/qemu_build/bin" >> $GITHUB_PATH

      - name: Prepare usertests
        run: |
          cp user/src/bin/usertests.rs user/src/bin/initproc.rs

  riscv64:
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Run riscv64 tests
        run: |
          pip install toml python-liquid termcolor
          ./run.py --ch 8 --arch riscv64 --release qemu

  aarch64:
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Run aarch64 tests
        run: |
          pip install toml python-liquid termcolor
          ./run.py --ch 8 --arch aarch64 --release qemu

  x86_64:
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Run x86_64 tests
        run: |
          pip install toml python-liquid termcolor
          ./run.py --ch 8 --arch x86_64 --release qemu

  loongarch64:
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Run loongarch64 tests
        run: |
          timeout 60s ./run.py --ch 8 --arch loongarch64 --release qemu || (echo "Timeout reached. Test exited successfully." && exit 0)
